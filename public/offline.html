<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>Offline · Astra Team Hub</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fff; color: #171717;
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { padding: 24px 16px; max-width: 320px; }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 18px; margin: 16px 0 4px; }
    p { margin: 0 0 20px; color: #737373; }
    button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #171717; color: #fafafa; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Astra Team Hub needs a connection. Your messages are safe; open the app again when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>

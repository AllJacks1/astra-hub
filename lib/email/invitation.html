<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Invitation to Astra Team Hub</title>
</head>
<body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #111;">
  <p>Hello,</p>
  <p>
    You have been invited to <strong>Astra Team Hub</strong>
    as <strong>{{role}}</strong>.
  </p>
  <p>This invitation expires on <strong>{{expires_at}}</strong>.</p>
  <p>
    <a href="{{accept_url}}"
       style="display:inline-block;padding:10px 16px;background:#430062;color:#fff;text-decoration:none;border-radius:6px;">
      Accept invitation
    </a>
  </p>
  <p style="color:#666;font-size:14px;">
    If the button does not work, open this link:<br />
    <a href="{{accept_url}}">{{accept_url}}</a>
  </p>
  <p style="color:#666;font-size:14px;">
    If you did not expect this email, you can ignore it.
  </p>
</body>
</html>
